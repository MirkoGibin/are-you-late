name = "are-you-late"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Not secret: the page origin allowed by CORS. Overridden locally in .dev.vars.
[vars]
ALLOWED_ORIGIN = "https://mirkogibin.github.io"

# PUSH_TOKEN is a secret: `wrangler secret put PUSH_TOKEN` (never in this file).

# Latest pushed status per leg. The id is filled in when the namespace is created.
[[kv_namespaces]]
binding = "STATUS"
id = "TO_BE_CREATED"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
